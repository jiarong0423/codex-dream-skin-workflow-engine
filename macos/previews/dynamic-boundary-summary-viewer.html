<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Boundary Summary Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090a;
      --panel: rgba(13, 16, 17, 0.86);
      --panel-2: rgba(20, 20, 18, 0.76);
      --line: rgba(116, 218, 228, 0.3);
      --line-strong: rgba(116, 218, 228, 0.7);
      --gold: #dfb15d;
      --green: #42d989;
      --red: #ef6c7a;
      --text: #f3f5ef;
      --muted: rgba(243, 245, 239, 0.64);
      --soft: rgba(243, 245, 239, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(13, 70, 73, 0.32), transparent 44%, rgba(88, 28, 41, 0.28)),
        radial-gradient(circle at 20% 16%, rgba(116, 218, 228, 0.14), transparent 32%),
        linear-gradient(135deg, rgba(10, 24, 28, 0.9), rgba(8, 9, 10, 0.94) 52%, rgba(40, 14, 24, 0.82)),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .shell {
      width: min(1280px, calc(100vw - 28px));
      min-height: calc(100vh - 28px);
      margin: 14px auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
    }

    .rail,
    .main,
    .panel,
    .lock-card,
    .target-row {
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(8, 34, 36, 0.58), rgba(14, 14, 15, 0.78) 46%, rgba(39, 15, 22, 0.6)),
        var(--panel);
      backdrop-filter: blur(12px) saturate(1.05);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    }

    .rail,
    .main {
      padding: 18px;
      align-self: start;
    }

    .brand {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 12px;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(243, 245, 239, 0.1);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line-strong);
      background:
        linear-gradient(90deg, transparent 45%, rgba(223, 177, 93, 0.66) 45% 55%, transparent 55%),
        linear-gradient(180deg, transparent 45%, rgba(116, 218, 228, 0.72) 45% 55%, transparent 55%),
        rgba(5, 14, 16, 0.86);
      box-shadow: inset 0 0 0 8px rgba(116, 218, 228, 0.08);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 20px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    h2 {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h3 {
      font-size: 15px;
      letter-spacing: 0;
    }

    .muted,
    .metric span,
    .lock-card small,
    .target-row small,
    .brand p {
      color: var(--muted);
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      color: rgba(243, 245, 239, 0.74);
      margin-bottom: 10px;
    }

    .control-stack {
      display: grid;
      gap: 10px;
    }

    .control-button,
    .file-input {
      min-height: 42px;
      width: 100%;
      border: 1px solid rgba(243, 245, 239, 0.14);
      background: rgba(0, 0, 0, 0.24);
      color: var(--text);
      padding: 0 12px;
      font-weight: 750;
    }

    .control-button {
      cursor: pointer;
      text-align: left;
    }

    .control-button.primary {
      border-color: rgba(223, 177, 93, 0.56);
      background: rgba(223, 177, 93, 0.16);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(243, 245, 239, 0.1);
    }

    .badge {
      border: 1px solid rgba(66, 217, 137, 0.46);
      background: rgba(20, 85, 52, 0.28);
      color: #dffbe9;
      padding: 8px 10px;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 800;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      min-height: 76px;
      border: 1px solid rgba(243, 245, 239, 0.12);
      background: rgba(0, 0, 0, 0.22);
      padding: 12px;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
      margin-top: 5px;
    }

    .panel {
      margin-top: 16px;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.16)),
        var(--panel-2);
    }

    .lock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .lock-card {
      min-height: 154px;
      padding: 12px;
      position: relative;
    }

    .lock-card[data-missing="true"] {
      border-color: rgba(239, 108, 122, 0.72);
      background:
        linear-gradient(90deg, rgba(68, 18, 27, 0.62), rgba(12, 13, 14, 0.82)),
        var(--panel);
    }

    .lock-card[data-high-memory="true"] {
      box-shadow:
        inset 4px 0 0 var(--gold),
        0 18px 48px rgba(0, 0, 0, 0.32);
    }

    .lock-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .lock-state {
      border: 1px solid rgba(66, 217, 137, 0.48);
      background: rgba(20, 85, 52, 0.28);
      color: #dffbe9;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .lock-card[data-missing="true"] .lock-state {
      border-color: rgba(239, 108, 122, 0.58);
      background: rgba(95, 20, 34, 0.34);
      color: #ffd8de;
    }

    .lock-counts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .count {
      min-height: 54px;
      border: 1px solid rgba(243, 245, 239, 0.1);
      background: rgba(0, 0, 0, 0.18);
      padding: 8px;
    }

    .count span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .count strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
    }

    .tag-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      border: 1px solid rgba(243, 245, 239, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(243, 245, 239, 0.78);
      font-size: 12px;
      padding: 3px 7px;
    }

    .target-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .target-row {
      min-height: 56px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 210px;
      resize: vertical;
      border: 1px solid rgba(243, 245, 239, 0.14);
      background: rgba(0, 0, 0, 0.32);
      color: var(--text);
      padding: 12px;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .status-line {
      min-height: 28px;
      margin-top: 10px;
      color: var(--muted);
    }

    .status-line[data-state="error"] {
      color: #ffd8de;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--line-strong);
      outline-offset: 2px;
    }

    @media (max-width: 940px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .metric-grid,
      .lock-grid {
        grid-template-columns: 1fr;
      }

      .topline {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 12px;
      }
    }
  </style>
</head>
<body data-viewer-mode="offline-summary-viewer">
  <main class="shell">
    <aside class="rail" aria-label="Summary controls">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Boundary Summary</h1>
          <p>offline artifact viewer</p>
        </div>
      </div>

      <section class="section">
        <div class="section-title">Input</div>
        <div class="control-stack">
          <input class="file-input" id="summaryFile" type="file" accept="application/json,.json">
          <button class="control-button primary" type="button" id="loadFixture">Load fixture summary</button>
          <button class="control-button" type="button" id="renderJson">Render pasted JSON</button>
          <button class="control-button" type="button" id="clearInput">Clear input</button>
        </div>
        <div class="status-line" id="statusLine">Ready</div>
      </section>

      <section class="section">
        <div class="section-title">JSON</div>
        <textarea id="jsonInput" spellcheck="false" aria-label="Summary JSON input"></textarea>
      </section>
    </aside>

    <section class="main" aria-label="Dynamic boundary summary">
      <div class="topline">
        <div>
          <h2 id="summaryTitle">Dynamic Boundary Locks</h2>
          <p class="muted" id="summaryPath">No artifact loaded</p>
        </div>
        <span class="badge" id="summaryMode">offline / read-only</span>
      </div>

      <section class="metric-grid" aria-label="Summary metrics">
        <div class="metric"><span>Locks</span><strong id="metricLocks">0/0</strong></div>
        <div class="metric"><span>Missing</span><strong id="metricMissing">0</strong></div>
        <div class="metric"><span>Risky</span><strong id="metricRisky">0</strong></div>
        <div class="metric"><span>Safe</span><strong id="metricSafe">0</strong></div>
        <div class="metric"><span>Targets</span><strong id="metricTargets">0</strong></div>
      </section>

      <section class="panel">
        <div class="section-title">Locks</div>
        <div class="lock-grid" id="lockGrid"></div>
      </section>

      <section class="panel">
        <div class="section-title">Inventory Targets</div>
        <div class="target-list" id="targetList"></div>
      </section>
    </section>
  </main>

  <script>
    const LOCK_LABELS = {
      sourcePreviewBlocks: "Source Preview Blocks",
      rightTopChips: "Right Top Chips",
      leftSidebarRows: "Left Sidebar Rows",
      projectPanelRows: "Project Panel Rows",
      accountPopover: "Account Popover",
      composerSurface: "Composer Surface",
      blackShellTransparency: "Black Shell Transparency"
    };

    const FIXTURE_SUMMARY = {
      ok: true,
      mode: "read-only-dynamic-boundary-artifact-summary",
      artifactDir: "fixture",
      mutates: false,
      launches: false,
      applies: false,
      clicks: false,
      drags: false,
      totals: {
        locks: 7,
        detectedLocks: 7,
        missingLocks: 0,
        inventoryTargets: 1,
        riskyCandidates: 10,
        safeCandidates: 2
      },
      missingLocks: [],
      highMemoryImageResizeLocks: ["sourcePreviewBlocks"],
      locks: [
        { id: "sourcePreviewBlocks", owner: "native", lockKey: "data-cit-source-preview-block", riskTags: ["high-memory-image-resize"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 0, kind: "source-preview", dragRisk: "high-memory-image-resize", label: "screenshot source preview" }] },
        { id: "rightTopChips", owner: "native", lockKey: "data-cit-right-top-chip", riskTags: ["dynamic-chip-stack"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 1, kind: "top-toolbar", label: "user attachment" }] },
        { id: "leftSidebarRows", owner: "native", lockKey: "data-cit-sidebar-row", riskTags: ["native-selection-state"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 2, kind: "sidebar", label: "project" }] },
        { id: "projectPanelRows", owner: "native", lockKey: "data-cit-project-panel-row", riskTags: ["dynamic-panel-width"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 3, kind: "right-panel", label: "source row" }] },
        { id: "accountPopover", owner: "native", lockKey: "data-cit-account-popover", riskTags: ["account-state"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 4, kind: "popover", label: "settings sign out" }] },
        { id: "composerSurface", owner: "native", lockKey: "data-cit-composer-surface", riskTags: ["text-input"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 0, safeCandidates: 2, riskyCandidates: 0, missing: false, examples: [{ index: 5, kind: "composer", label: "message composer" }] },
        { id: "blackShellTransparency", owner: "native", lockKey: "data-cit-black-shell", riskTags: ["official-black-shell", "dynamic-native-container"], detected: 2, inventoryDetected: 1, clickableDetected: 1, dynamicDetected: 2, safeCandidates: 0, riskyCandidates: 2, missing: false, examples: [{ index: 6, kind: "black-shell", label: "official near-black workspace shell" }] }
      ],
      inventoryTargets: [
        { id: "fixture-target", title: "Fixture Renderer", url: "fixture://dynamic-boundary", detectedLocks: 7, totalLocks: 7, missingLocks: [] }
      ],
      warnings: []
    };

    const jsonInput = document.getElementById("jsonInput");
    const statusLine = document.getElementById("statusLine");
    const lockGrid = document.getElementById("lockGrid");
    const targetList = document.getElementById("targetList");

    function safeNumber(value) {
      return Number.isFinite(Number(value)) ? Number(value) : 0;
    }

    function setStatus(text, state = "ready") {
      statusLine.textContent = text;
      statusLine.dataset.state = state;
    }

    function text(value) {
      return String(value === undefined || value === null ? "" : value);
    }

    function renderMetric(id, value) {
      document.getElementById(id).textContent = text(value);
    }

    function tagList(values) {
      const tags = document.createElement("div");
      tags.className = "tag-list";
      for (const value of values || []) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = text(value);
        tags.appendChild(tag);
      }
      return tags;
    }

    function renderLock(lock) {
      const card = document.createElement("article");
      card.className = "lock-card";
      card.dataset.lockId = lock.id || "";
      card.dataset.missing = String(Boolean(lock.missing));
      card.dataset.highMemory = String((lock.highMemoryImageResizeExamples || []).length > 0 || (lock.riskTags || []).includes("high-memory-image-resize"));

      const head = document.createElement("div");
      head.className = "lock-head";
      const titleWrap = document.createElement("div");
      const title = document.createElement("h3");
      title.textContent = LOCK_LABELS[lock.id] || lock.id || "Unknown Lock";
      const subtitle = document.createElement("small");
      subtitle.textContent = `${lock.id || "unknown"} / ${lock.owner || "unknown"}`;
      titleWrap.append(title, subtitle);
      const state = document.createElement("span");
      state.className = "lock-state";
      state.textContent = lock.missing ? "Missing" : "Locked";
      head.append(titleWrap, state);
      card.appendChild(head);

      const counts = document.createElement("div");
      counts.className = "lock-counts";
      const countValues = [
        ["Detected", lock.detected],
        ["Inventory", lock.inventoryDetected],
        ["Clickable", lock.clickableDetected],
        ["Risky", lock.riskyCandidates]
      ];
      for (const [label, value] of countValues) {
        const item = document.createElement("div");
        item.className = "count";
        const itemLabel = document.createElement("span");
        itemLabel.textContent = label;
        const itemValue = document.createElement("strong");
        itemValue.textContent = text(safeNumber(value));
        item.append(itemLabel, itemValue);
        counts.appendChild(item);
      }
      card.appendChild(counts);
      card.appendChild(tagList(lock.riskTags || []));
      return card;
    }

    function renderTarget(target) {
      const row = document.createElement("article");
      row.className = "target-row";
      const left = document.createElement("div");
      const title = document.createElement("h3");
      title.textContent = target.title || target.id || "Target";
      const url = document.createElement("small");
      url.textContent = target.url || "";
      left.append(title, url);
      const right = document.createElement("strong");
      right.textContent = `${safeNumber(target.detectedLocks)}/${safeNumber(target.totalLocks)}`;
      row.append(left, right);
      return row;
    }

    function renderSummary(summary) {
      if (!summary || typeof summary !== "object") {
        throw new Error("summary must be an object");
      }
      if (summary.mode !== "read-only-dynamic-boundary-artifact-summary") {
        throw new Error("unsupported summary mode");
      }
      const totals = summary.totals || {};
      renderMetric("metricLocks", `${safeNumber(totals.detectedLocks)}/${safeNumber(totals.locks)}`);
      renderMetric("metricMissing", safeNumber(totals.missingLocks));
      renderMetric("metricRisky", safeNumber(totals.riskyCandidates));
      renderMetric("metricSafe", safeNumber(totals.safeCandidates));
      renderMetric("metricTargets", safeNumber(totals.inventoryTargets));
      document.getElementById("summaryPath").textContent = summary.artifactDir || "memory";
      document.getElementById("summaryMode").textContent = summary.ok ? "ok / read-only" : "needs review";

      lockGrid.replaceChildren();
      for (const lock of summary.locks || []) {
        lockGrid.appendChild(renderLock(lock));
      }
      targetList.replaceChildren();
      const targets = summary.inventoryTargets || [];
      if (targets.length === 0) {
        const empty = document.createElement("article");
        empty.className = "target-row";
        empty.innerHTML = "<div><h3>No targets</h3><small>offline fixture or missing inventory artifact</small></div><strong>0/0</strong>";
        targetList.appendChild(empty);
      } else {
        for (const target of targets) {
          targetList.appendChild(renderTarget(target));
        }
      }
      setStatus(summary.ok ? "Rendered summary" : "Rendered summary with review items");
      return summary;
    }

    function loadJsonText(raw) {
      const summary = JSON.parse(raw);
      renderSummary(summary);
      return summary;
    }

    document.getElementById("loadFixture").addEventListener("click", () => {
      const raw = JSON.stringify(FIXTURE_SUMMARY, null, 2);
      jsonInput.value = raw;
      renderSummary(FIXTURE_SUMMARY);
    });

    document.getElementById("renderJson").addEventListener("click", () => {
      try {
        loadJsonText(jsonInput.value);
      } catch (error) {
        setStatus(error.message || "invalid JSON", "error");
      }
    });

    document.getElementById("clearInput").addEventListener("click", () => {
      jsonInput.value = "";
      lockGrid.replaceChildren();
      targetList.replaceChildren();
      renderMetric("metricLocks", "0/0");
      renderMetric("metricMissing", "0");
      renderMetric("metricRisky", "0");
      renderMetric("metricSafe", "0");
      renderMetric("metricTargets", "0");
      document.getElementById("summaryPath").textContent = "No artifact loaded";
      document.getElementById("summaryMode").textContent = "offline / read-only";
      setStatus("Ready");
    });

    document.getElementById("summaryFile").addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const raw = String(reader.result || "");
          jsonInput.value = raw;
          const summary = loadJsonText(raw);
          document.getElementById("summaryPath").textContent = file.name || summary.artifactDir || "local file";
        } catch (error) {
          setStatus(error.message || "invalid JSON file", "error");
        }
      });
      reader.addEventListener("error", () => setStatus("Cannot read file", "error"));
      reader.readAsText(file);
    });

    renderSummary(FIXTURE_SUMMARY);
  </script>
</body>
</html>
