<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knife Shield Dog Icon Set</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111820; color: #f4f7fb; }
    main { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 40px 0; }
    h1 { margin: 0 0 28px; font-size: 28px; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; min-width: 0; padding: 16px 8px 12px; border: 1px solid #32485b; border-radius: 8px; background: #19232d; text-align: center; }
    img { display: block; width: 72px; height: 72px; margin: 0 auto 10px; }
    figcaption { overflow: hidden; color: #dce6f0; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Knife Shield Dog</h1>
    <section class="grid" aria-label="Icon set">
      <figure><img src="../runtime/icons/search.svg" alt=""><figcaption>Search</figcaption></figure>
      <figure><img src="../runtime/icons/newTask.svg" alt=""><figcaption>New task</figcaption></figure>
      <figure><img src="../runtime/icons/back.svg" alt=""><figcaption>Back</figcaption></figure>
      <figure><img src="../runtime/icons/forward.svg" alt=""><figcaption>Forward</figcaption></figure>
      <figure><img src="../runtime/icons/stop.svg" alt=""><figcaption>Stop</figcaption></figure>
      <figure><img src="../runtime/icons/settings.svg" alt=""><figcaption>Settings</figcaption></figure>
      <figure><img src="../runtime/icons/project.svg" alt=""><figcaption>Project</figcaption></figure>
      <figure><img src="../runtime/icons/send.svg" alt=""><figcaption>Send</figcaption></figure>
      <figure><img src="../runtime/icons/tagTask.svg" alt=""><figcaption>Tag task</figcaption></figure>
      <figure><img src="../runtime/icons/files.svg" alt=""><figcaption>Files</figcaption></figure>
      <figure><img src="../runtime/icons/thread.svg" alt=""><figcaption>Thread</figcaption></figure>
      <figure><img src="../runtime/icons/clean.svg" alt=""><figcaption>Clean</figcaption></figure>
      <figure><img src="../runtime/icons/run.svg" alt=""><figcaption>Run</figcaption></figure>
      <figure><img src="../runtime/icons/spark.svg" alt=""><figcaption>Spark</figcaption></figure>
      <figure><img src="../runtime/icons/package.svg" alt=""><figcaption>Package</figcaption></figure>
      <figure><img src="../runtime/icons/trigger.svg" alt=""><figcaption>Shield trigger</figcaption></figure>
    </section>
  </main>
</body>
</html>
